# Production-like stack: compiled backend + nginx-served frontend, built from the "production"
# Dockerfile targets. Use it to verify a release locally or as the basis of a single-host deployment.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
#   Frontend + API  http://localhost:3000  (nginx serves the app and proxies /api/* to the backend)
#
# Differences from the development stack (docker-compose.yml):
#   - only nginx is published; the backend and MongoDB are reachable only inside Docker
#   - MongoDB sits on an internal network with no outside connectivity
#   - no source mounts, no dev dependencies, non-root containers, MOOD=PROD
#   - separate project name, so it never touches the development database volume
#
# For a real deployment, point DOCKER_DB_LOCAL at a managed, authenticated replica set (e.g. Atlas)
# and put TLS in front of nginx; the bundled mongo service has no authentication.
name: ecommerce-prod

services:
  mongo:
    image: mongo:${MONGO_VERSION:-7}
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: production
    image: ecommerce-backend:prod
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      DB_LOCAL: ${DOCKER_DB_LOCAL:-mongodb://mongo:27017/ecommerce?replicaSet=rs0}
      PORT: "5000"
      MOOD: PROD
      FE_URL: ${FE_URL:-http://localhost:3000}
      # The API is served to browsers under the frontend's origin
      API_PUBLIC_URL: ${FE_URL:-http://localhost:3000}/api
      # Exactly one proxy (nginx) in front, and the backend is not published, so X-Forwarded-For
      # can be trusted for the per-client rate limits
      TRUST_PROXY: "1"
    networks:
      - web
      - db
    depends_on:
      mongo:
        condition: service_healthy
    # Healthcheck comes from the image (GET /health)

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: /api
        VITE_BEARER_KEY: ${BEARER_KEY:-Bearer__}
    image: ecommerce-frontend:prod
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
    # Healthcheck comes from the image (GET /healthz)

networks:
  web:
  db:
    internal: true

volumes:
  mongo_data:
