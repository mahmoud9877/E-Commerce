name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- CI: compile and check the code
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Report-only until the flagged dependencies are upgraded; switch off continue-on-error afterwards
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ---- Build the image, boot it against a real MongoDB replica set, then publish
  docker:
    name: Docker build, smoke test & publish
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ecommerce-api:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Placeholder values from .env.example: startup only checks they exist; external services are not called
      - name: Create env file from template
        run: |
          mkdir -p config
          cp .env.example config/.env

      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:5000/
          # Unknown routes must return the JSON 404, proving routing and error handling are wired
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/does-not-exist)" = "404"
          # Protected routes must reject anonymous requests
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/cart)" = "401"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v

      # ---- CD: publish the image on every push to main
      - name: Image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
