name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Backend: typecheck, integration tests, compile
  backend:
    name: Backend - typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Integration tests against an in-memory MongoDB replica set; external services are faked
      - run: npm test
      - run: npm run build

      # Fails the build on any high or critical vulnerability in production dependencies
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ---- Frontend: typecheck + production bundle
  frontend:
    name: Frontend - typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # `build` runs the typecheck first
      - run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ---- Build every image, boot the production stack, smoke test it through nginx, then publish
  docker:
    name: Docker - build, smoke test & publish
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Placeholder values from .env.example: startup only checks they exist; external services are not called
      - name: Create env file from template
        run: cp .env.example .env

      - name: Validate compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      # Development targets must keep building too (they are what `docker compose up` runs)
      - name: Build development images
        run: docker compose build

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

      - name: Start production stack
        run: docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: |
          # nginx serves the app...
          curl --fail --silent --show-error http://localhost:3000/ | grep -q '<div id="root">'
          # ...and proxies /api to the backend, which is connected to MongoDB
          curl --fail --silent --show-error http://localhost:3000/api/health | grep -q '"ok"'
          # Unknown routes must return the JSON 404, proving routing and error handling are wired
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/does-not-exist)" = "404"
          # Protected routes must reject anonymous requests
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/cart)" = "401"
          # The backend and MongoDB must not be published in the production stack
          ! curl -s -m 3 http://localhost:5000/health
          ! (exec 3<>/dev/tcp/127.0.0.1/27017) 2>/dev/null

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

      # ---- CD: publish both production images on every push to main
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          for app in backend frontend; do
            for tag in "${GITHUB_SHA::7}" latest; do
              docker tag "ecommerce-$app:prod" "$repo/$app:$tag"
              docker push "$repo/$app:$tag"
            done
          done
